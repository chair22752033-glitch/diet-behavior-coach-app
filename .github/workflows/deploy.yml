# 推到 master 就自動驗證並部署到 Cloudflare Workers。
#
# 需要 repo secret：CLOUDFLARE_API_TOKEN
#   GitHub → Settings → Secrets and variables → Actions → New repository secret
#   沒設定的話部署步驟會失敗，網站不受影響（維持上一次部署的樣子）。
#
# 規則：master 上是什麼，線上就是什麼。
# 驗證步驟（語法＋ wrangler dry-run 打包）不需要任何憑證，失敗就不會部署。

name: Verify and Deploy

on:
  push:
    branches: [master]
    paths-ignore:
      - '**/*.md'
      - '.claude/**'
  # 也可以在 Actions 頁面手動按一下重新部署（手機上也按得到）
  workflow_dispatch:

# 同一時間只跑一個部署，避免兩次推送互相蓋過去
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: a6d9cbae720e9a59dc0487fde7b832b7
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax check
        run: node --check src/worker.js

      - name: Verify Worker config and bundle (dry-run, no deploy)
        run: npx --yes wrangler@4 deploy --dry-run

      - name: Deploy to Cloudflare Workers
        run: npx --yes wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
