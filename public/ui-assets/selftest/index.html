<!doctype html>
<html lang="zh-Hant"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>加密相容性自我檢查</title>
<style>
 body{font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;background:#FBF3E7;color:#4a3728;margin:0;padding:20px;line-height:1.6}
 .wrap{max-width:560px;margin:0 auto}
 h1{font-size:20px}
 .verdict{font-size:22px;font-weight:800;padding:14px;border-radius:12px;text-align:center;margin:14px 0}
 .pass{background:#e6f3e6;color:#1b7a1b}.failv{background:#f6e0e0;color:#a33}.run{background:#fff;border:1px solid #e5d5bf}
 .row{display:flex;justify-content:space-between;padding:9px 12px;border:1px solid #e5d5bf;border-radius:8px;margin:6px 0;background:#fff;font-size:14px}
 .ok{color:#1b7a1b;font-weight:700}.no{color:#a33;font-weight:700}
 .muted{color:#8a7a68;font-size:12px}
 code{background:#f0e6d6;padding:1px 5px;border-radius:4px;font-size:12px;word-break:break-all}
</style></head>
<body><div class="wrap">
<h1>🔒 加密相容性自我檢查</h1>
<p class="muted">這個頁面只在你的瀏覽器裡測試「這台裝置是否支援我們加密功能需要的技術」。<strong>不會上傳任何資料、不需要登入、不會儲存你的任何內容。</strong>打開就會自動跑，把結果截圖給我即可。</p>
<div id="verdict" class="verdict run">檢查中…</div>
<div id="rows"></div>
<p class="muted" id="ua"></p>
<p class="muted">用途：確認 iOS Safari／Android Chrome／Firefox 等瀏覽器支援 AES-KW、HKDF、不可匯出金鑰與 IndexedDB——這是未來「使用者持鑰加密」功能的前提。</p>
<script>
const results=[];
function add(name,ok,note){results.push({name,ok,note});}
async function run(){
 try{
  add('Web Crypto 存在', !!(self.crypto && self.crypto.subtle && self.crypto.getRandomValues));
  // AES-KW 非匯出金鑰 + 包裝/解包
  let akw;
  try{ akw=await crypto.subtle.generateKey({name:'AES-KW',length:256},false,['wrapKey','unwrapKey']); add('AES-KW 產生非匯出金鑰',!!akw); }
  catch(e){ add('AES-KW 產生非匯出金鑰',false,e.message); }
  // HKDF
  try{ const ikm=await crypto.subtle.importKey('raw',crypto.getRandomValues(new Uint8Array(32)),'HKDF',false,['deriveBits']);
   const bits=await crypto.subtle.deriveBits({name:'HKDF',hash:'SHA-256',salt:new Uint8Array(16),info:new Uint8Array(0)},ikm,256);
   add('HKDF-SHA256 導出金鑰', bits && bits.byteLength===32); }
  catch(e){ add('HKDF-SHA256 導出金鑰',false,e.message); }
  // AES-GCM 加解密來回
  try{ const k=await crypto.subtle.generateKey({name:'AES-GCM',length:256},true,['encrypt','decrypt']);
   const iv=crypto.getRandomValues(new Uint8Array(12)); const pt=new TextEncoder().encode('宵夜測試 test');
   const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},k,pt);
   const back=new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv},k,ct));
   add('AES-GCM 加解密來回', new TextDecoder().decode(back)==='宵夜測試 test'); }
  catch(e){ add('AES-GCM 加解密來回',false,e.message); }
  // 非匯出金鑰確實不可匯出
  try{ await crypto.subtle.exportKey('raw',akw); add('不可匯出金鑰無法被匯出',false,'export 竟然成功'); }
  catch(e){ add('不可匯出金鑰無法被匯出', !!akw); }
  // IndexedDB 存取 CryptoKey
  try{
   const okIdb=await new Promise(function(res){
    const r=indexedDB.open('selftest_db',1);
    r.onupgradeneeded=function(){r.result.createObjectStore('k');};
    r.onerror=function(){res(false);};
    r.onsuccess=function(){ const db=r.result; const tx=db.transaction('k','readwrite'); tx.objectStore('k').put(akw||'x','key');
     tx.oncomplete=function(){ const tx2=db.transaction('k','readonly'); const g=tx2.objectStore('k').get('key'); g.onsuccess=function(){res(!!g.result);}; g.onerror=function(){res(false);}; };
     tx.onerror=function(){res(false);}; };
   });
   add('IndexedDB 可存取金鑰', okIdb);
  }catch(e){ add('IndexedDB 可存取金鑰',false,e.message); }
 }catch(e){ add('FATAL',false,e&&e.message); }

 const rows=document.getElementById('rows'); rows.innerHTML='';
 results.forEach(function(r){
  const d=document.createElement('div'); d.className='row';
  d.innerHTML='<span>'+r.name+(r.note?' <span class=muted>('+r.note+')</span>':'')+'</span><span class="'+(r.ok?'ok':'no')+'">'+(r.ok?'✓ 支援':'✗ 不支援')+'</span>';
  rows.appendChild(d);
 });
 const failed=results.filter(function(r){return !r.ok;}).length;
 const v=document.getElementById('verdict');
 if(failed===0){ v.className='verdict pass'; v.textContent='✓ 這台裝置完全支援（'+results.length+'/'+results.length+'）'; }
 else{ v.className='verdict failv'; v.textContent='✗ 有 '+failed+' 項不支援，請把本頁截圖給我'; }
 document.getElementById('ua').innerHTML='裝置資訊：<code>'+String(navigator.userAgent)+'</code>';
}
run();
</script>
</div></body></html>
